# ============================================================================
#  CRITÉRIOS DE CLASSIFICAÇÃO BIBLIOGRÁFICA — PROJETO RAIP
#  Regime Ambiental Internacional dos Portos (Tawan Ranny / UniSantos)
# ============================================================================
#  Este arquivo é o "cérebro" do app. Ele NÃO decide só "elegível/não": ele
#  classifica cada obra por GRAU DE INCORPORAÇÃO e a distribui nas 9 PASTAS
#  TEMÁTICAS, seguindo as Seções 5 a 7 do documento operacional do RAIP.
#
#  Esquema híbrido (econômico em tokens):
#    1) REGRAS  -> autores centrais + palavras-chave por grau + pastas.
#                  Custo ZERO de token.
#    2) DECISÃO -> grau 1.º / 2.º / 3.º / Irrelevante a partir dos sinais.
#    3) IA      -> só quando as regras não acham nada (dúvida), enviando
#                  APENAS título + sumário. O resultado fica em cache.
# ============================================================================

# ---------------------------------------------------------------------------
# 0. LISTA DE LIVROS ELEITOS (opcional). Se preenchida, ela MANDA: a obra é
#    elegível se estiver na lista (casa por título/nome do arquivo). Útil para
#    importar os 63 títulos já mapeados. Deixe vazio p/ usar a classificação.
# ---------------------------------------------------------------------------
lista_livros_eleitos: []
arquivo_livros_eleitos: ""   # ex.: "config/livros_eleitos.txt"

# ---------------------------------------------------------------------------
# 1. ESCOPO DA PESQUISA (usado como instrução para a IA nos casos em dúvida)
# ---------------------------------------------------------------------------
escopo_pesquisa: |
  TÍTULO: Regime Ambiental Internacional dos Portos (RAIP): arquitetura
  dogmática, fragmentação normativa e governança multinível.
  Doutorado em Direito Ambiental Internacional (UniSantos).

  TEMA CENTRAL: investigar se é possível construir dogmaticamente, a partir da
  integração hermenêutica dos regimes ambientais marítimos existentes e da
  articulação entre instrumentos vinculantes e de orientação técnica em
  governança multinível, um Regime Ambiental Internacional dos Portos com
  coerência normativa própria, capaz de superar a fragmentação regulatória e de
  fundamentar mecanismos de conformidade, resolução de controvérsias e equidade
  competitiva global. Diagnóstico-chave: o sistema marítimo-ambiental do porto
  está "saturado em densidade normativa, mas subestruturado em integração
  dogmática".

  PERGUNTA: como construir dogmaticamente um RAIP que supere as assimetrias
  regulatórias nacionais e promova a integração normativa global, conciliando
  sustentabilidade, eficiência operacional e equidade competitiva.

  RECORTE NORMATIVO (os seis regimes): UNCLOS (1982); MARPOL (poluição por
  navios); Convenção de Água de Lastro (espécies invasoras); OPRC (poluição por
  óleo); Convenção de Basileia (resíduos perigosos); Acordo BBNJ (biodiversidade
  além da jurisdição nacional). RECORTE GEOGRÁFICO: portos de Santos, Roterdã,
  Singapura e Durban (valor heurístico ilustrativo). MÉTODO: dogmático-jurídico
  e hermenêutico, com função propositiva.

  UMA OBRA É RELEVANTE quando trata de: uma das matrizes teóricas centrais
  (ver autores abaixo); um dos seis regimes; hermenêutica jurídica aplicada ao
  Direito Internacional/Ambiental; fragmentação, integração sistêmica, complexo
  de regimes (art. 31.3.c da Convenção de Viena); governança portuária ambiental
  com dimensão normativa/institucional; Direito do Mar; jurisdição marítima e
  controle do Estado do porto. É IRRELEVANTE quando: trata só de Direito
  Ambiental doméstico sem plano internacional; Direito Internacional sem
  dimensão ambiental/marítima; economia/logística portuária sem dimensão
  normativa; metodologia científica geral sem aplicação à pesquisa jurídica;
  Direito Marítimo privado (afretamento, avaria, seguro) sem interface ambiental.

